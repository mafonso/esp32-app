name: Build firmware

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3

      - name: Image size
        run: ls -l build/esp32-app.bin

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-app-${{ github.sha }}
          path: build/esp32-app.bin
