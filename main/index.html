<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Board</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #667085;
  --line: #e4e7ec; --accent: #2563eb; --accent-text: #ffffff;
  --ok: #16a34a; --warn: #d97706; --err: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --card: #171a21; --text: #e6e8eb; --muted: #8b93a1;
    --line: #262b35; --accent: #3b82f6; --accent-text: #ffffff;
    --ok: #22c55e; --warn: #f59e0b; --err: #f87171;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
.sub { color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: middle; }
.dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.card.wide { grid-column: 1 / -1; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.version { font-size: 28px; font-weight: 650; margin: 0 0 4px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
button {
  font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
  padding: 8px 14px; border-radius: 8px; cursor: pointer;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button:disabled { opacity: .5; cursor: default; }
.msg { margin-top: 12px; color: var(--muted); }
.msg.ok { color: var(--ok); } .msg.warn { color: var(--warn); } .msg.err { color: var(--err); }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 12px; display: none; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.meter { height: 4px; background: var(--line); border-radius: 2px; margin-top: 2px; overflow: hidden; }
.meter > div { height: 100%; background: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="host">ESP32</h1>
    <span class="sub"><span id="netdot" class="dot"></span><span id="netline">connecting…</span></span>
  </header>

  <div class="grid">
    <section class="card wide">
      <h2>Firmware</h2>
      <p class="version" id="ver">–</p>
      <div class="sub" id="build">–</div>
      <div class="row">
        <button id="check" class="primary">Check for updates</button>
        <button id="install" hidden>Install</button>
        <button id="reboot">Reboot</button>
      </div>
      <div class="bar" id="bar"><div></div></div>
      <div class="msg" id="otamsg"></div>
    </section>

    <section class="card">
      <h2>Board</h2>
      <dl>
        <dt>Chip</dt><dd id="chip">–</dd>
        <dt>CPU</dt><dd id="cpu">–</dd>
        <dt>Flash</dt><dd id="flash">–</dd>
        <dt>Temperature</dt><dd id="temp">–</dd>
        <dt>MAC</dt><dd id="mac">–</dd>
      </dl>
    </section>

    <section class="card">
      <h2>Runtime</h2>
      <dl>
        <dt>Uptime</dt><dd id="uptime">–</dd>
        <dt>Last reset</dt><dd id="reset">–</dd>
        <dt>Heap free</dt><dd id="heap">–</dd>
        <dt>Heap low-water</dt><dd id="heapmin">–</dd>
        <dt>PSRAM free</dt><dd id="psram">–</dd>
      </dl>
    </section>

    <section class="card">
      <h2>Network</h2>
      <dl>
        <dt>SSID</dt><dd id="ssid">–</dd>
        <dt>Signal</dt><dd id="rssi">–</dd>
        <dt>IP</dt><dd id="ip">–</dd>
        <dt>Hostname</dt><dd id="hostname">–</dd>
      </dl>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const mb = b => (b / 1048576).toFixed(b >= 10485760 ? 0 : 1) + ' MB';
const kb = b => Math.round(b / 1024) + ' KB';
const post = url => fetch(url, { method: 'POST', headers: { 'X-Requested-With': 'fetch' } });

function duration(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h ${m}m` : h ? `${h}h ${m}m` : `${m}m ${s % 60}s`;
}

function signal(rssi) {
  const q = rssi >= -60 ? 'excellent' : rssi >= -70 ? 'good' : rssi >= -80 ? 'fair' : 'weak';
  return `${rssi} dBm (${q})`;
}

async function refreshInfo() {
  try {
    const r = await fetch('/api/info');
    const { firmware: f, board: b, wifi: w } = await r.json();
    document.title = `${w.hostname} · ${f.version}`;
    $('host').textContent = w.hostname;
    $('netdot').className = 'dot ' + (w.connected ? 'ok' : 'err');
    $('netline').textContent = w.connected ? `${w.ssid} · ${w.ip}` : 'Wi-Fi disconnected';
    $('ver').textContent = f.version;
    $('build').textContent = `${f.project} · built ${f.build_date} ${f.build_time} · ESP-IDF ${f.idf} · slot ${f.partition}`;
    $('chip').textContent = `${b.chip.toUpperCase()} rev ${Math.floor(b.revision / 100)}.${b.revision % 100}`;
    $('cpu').textContent = `${b.cores} cores @ ${b.cpu_mhz} MHz`;
    $('flash').textContent = mb(b.flash_bytes);
    $('temp').textContent = b.temp_c !== undefined ? b.temp_c.toFixed(1) + ' °C' : 'n/a';
    $('mac').textContent = b.mac;
    $('uptime').textContent = duration(b.uptime_s);
    $('reset').textContent = b.reset_reason;
    $('heap').textContent = kb(b.heap_free);
    $('heapmin').textContent = kb(b.heap_min_free);
    $('psram').textContent = b.psram_bytes ? `${mb(b.psram_free)} of ${mb(b.psram_bytes)}` : 'none';
    $('ssid').textContent = w.ssid || '–';
    $('rssi').textContent = w.connected ? signal(w.rssi) : '–';
    $('ip').textContent = w.ip || '–';
    $('hostname').textContent = w.hostname + '.local';
  } catch (e) {
    $('netdot').className = 'dot err';
    $('netline').textContent = 'board unreachable';
  }
}

function showOta(o) {
  const msg = $('otamsg'), bar = $('bar'), install = $('install');
  const busy = o.state === 'checking' || o.state === 'downloading' || o.state === 'rebooting';
  $('check').disabled = busy;
  install.disabled = busy;
  install.hidden = !o.checked || busy;
  bar.style.display = o.state === 'downloading' || o.state === 'rebooting' ? 'block' : 'none';
  if (o.total_bytes) bar.firstElementChild.style.width = (100 * o.bytes_read / o.total_bytes) + '%';

  if (o.state === 'error') {
    msg.className = 'msg err'; msg.textContent = o.error;
  } else if (o.state === 'checking') {
    msg.className = 'msg'; msg.textContent = 'Checking GitHub releases…';
  } else if (o.state === 'downloading') {
    msg.className = 'msg';
    msg.textContent = o.total_bytes
      ? `Downloading ${o.latest}: ${kb(o.bytes_read)} of ${kb(o.total_bytes)}`
      : `Connecting to download ${o.latest}…`;
  } else if (o.state === 'rebooting') {
    msg.className = 'msg ok'; msg.textContent = `Installed ${o.latest}. Rebooting…`;
  } else if (o.checked) {
    if (o.update_available) {
      msg.className = 'msg warn';
      msg.textContent = `Version ${o.latest} is available (running ${o.running}).` + (o.notes ? ' ' + o.notes : '');
      install.textContent = `Install ${o.latest}`;
      install.className = 'primary';
    } else {
      msg.className = 'msg ok';
      msg.textContent = `Up to date. Latest release is ${o.latest}.`;
      install.textContent = `Reinstall ${o.latest}`;
      install.className = '';
    }
  }
  return o.state;
}

async function pollOta() {
  let state;
  do {
    await new Promise(r => setTimeout(r, 1000));
    try { state = showOta(await (await fetch('/api/ota')).json()); }
    catch (e) { state = 'rebooting'; }  // board is restarting
  } while (state === 'downloading');
  if (state === 'rebooting') waitForReboot();
}

async function waitForReboot() {
  $('otamsg').className = 'msg';
  $('otamsg').textContent = 'Waiting for the board to come back…';
  await new Promise(r => setTimeout(r, 4000));
  for (;;) {
    try {
      const r = await fetch('/api/info', { cache: 'no-store' });
      if (r.ok) { location.reload(); return; }
    } catch (e) { }
    await new Promise(r => setTimeout(r, 2000));
  }
}

$('check').onclick = async () => {
  showOta({ state: 'checking' });
  try { showOta(await (await post('/api/ota/check')).json()); }
  catch (e) { showOta({ state: 'error', error: 'Request failed' }); }
};

$('install').onclick = async () => {
  if (!confirm(`Install ${$('install').textContent.replace(/^\w+ /, '')} and reboot the board?`)) return;
  const r = await post('/api/ota/update');
  if (!r.ok) { showOta({ state: 'error', error: await r.text() }); return; }
  showOta(await r.json());
  pollOta();
};

$('reboot').onclick = async () => {
  if (!confirm('Reboot the board?')) return;
  await post('/api/reboot');
  waitForReboot();
};

refreshInfo();
setInterval(refreshInfo, 3000);
fetch('/api/ota').then(r => r.json()).then(o => { if (showOta(o) === 'downloading') pollOta(); });
</script>
</body>
</html>
